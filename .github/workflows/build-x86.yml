#============================================================================================
# X86 only - lede-master (始终拉取最新源码)
#============================================================================================

name: X86设备编译固件 (lede-master)

on:
  workflow_dispatch:
  repository_dispatch:
  # 每周一自动编译一次（UTC 02:00 ≈ 北京时间 10:00）
  schedule:
    - cron: '0 2 * * 1'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: config/lede-master/config
  DIY_P1_SH: config/lede-master/diy-part1.sh
  DIY_P2_SH: config/lede-master/diy-part2.sh
  UPLOAD_BIN: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    if: github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show free space
        run: df -hT

      - name: Init environment
        run: |
          set -e
          sudo -E apt-get -y update
          # 固定依赖列表（原 is.gd 短链已失效）
          sudo -E DEBIAN_FRONTEND=noninteractive apt-get -y install --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool lld llvm mkisofs ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-pyelftools qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo unzip vim wget \
            xmlto xxd zlib1g-dev file time
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$USER /workdir

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ccache-x86-${{ runner.os }}-${{ hashFiles('config/lede-master/config') }}
          restore-keys: |
            ccache-x86-${{ runner.os }}-
            ccache-x86-

      - name: Clone latest lede source
        working-directory: /workdir
        run: |
          set -e
          echo ">>> 正在拉取最新 lede 源码 (branch: $REPO_BRANCH)..."
          # 始终拉取最新源码（--depth=1 只取最新提交）
          git clone -q --single-branch --depth=1 --branch=$REPO_BRANCH $REPO_URL openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

          cd openwrt
          echo "----------------------------------------"
          echo "源码仓库 : $REPO_URL"
          echo "分支     : $REPO_BRANCH"
          echo "最新提交 : $(git rev-parse --short HEAD)"
          echo "提交信息 : $(git log -1 --pretty=format:'%s')"
          echo "提交时间 : $(git log -1 --pretty=format:'%ci')"
          echo "----------------------------------------"
          df -hT

      - name: Load diy-part1 & feeds
        run: |
          set -e
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config & diy-part2
        run: |
          set -e
          cd openwrt
          [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ] && cp -f $GITHUB_WORKSPACE/$CONFIG_FILE .config
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P2_SH
          make defconfig

      - name: Download packages
        run: |
          set -e
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \; || true

      - name: Compile firmware
        id: compile
        run: |
          set -e
          cd openwrt
          echo ">>> $(nproc) threads compiling..."
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_ENV
          df -hT

      - name: Organize firmware
        if: env.status == 'success' && !cancelled()
        run: |
          set -e
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
          ls -lh

      - name: Upload firmware artifact
        if: env.UPLOAD_FIRMWARE == 'true' && env.status == 'success' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_x86_64_${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          retention-days: 7

      - name: Create release
        if: env.UPLOAD_RELEASE == 'true' && env.status == 'success' && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x86-${{ env.FILE_DATE }}
          name: OpenWrt X86_64 ${{ env.FILE_DATE }}
          body: |
            ### OpenWrt X86_64 固件

            - **源码**: [coolsnowwolf/lede](https://github.com/coolsnowwolf/lede) `master`（每次构建自动拉取最新）
            - **目标**: x86_64 (generic)
            - **默认 IP**: `192.168.100.222`
            - **默认主题**: Argon
            - **构建时间**: ${{ env.FILE_DATE }}

            刷写后请使用浏览器访问 http://192.168.100.222
          files: ${{ env.FIRMWARE }}/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 2
          token: ${{ secrets.GITHUB_TOKEN }}
